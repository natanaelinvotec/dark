name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Sintaxe do painel
        run: for f in web/config.js web/js/*.js; do node --check "$f"; done
      - name: JSON válidos
        run: for f in web/dados/*.json firebase.json firestore.indexes.json .firebaserc; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
      - name: Testes do motor
        run: node --test tests/*.test.js
