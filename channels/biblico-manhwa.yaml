# Canal Bíblico em formato manhwa com "janelas de missão".
# Abrir/fechar o canal = mudar "enabled". Tudo que muda por episódio vem do roteiro;
# tudo que nunca muda (estilo, fichas, janela) fica aqui.

slug: biblico-manhwa
nome: Bíblico
cor: "#2563C9"
enabled: true
idioma: pt-BR
descricao: Histórias bíblicas em manhwa com janelas de missão
pasta: Canal-Biblico            # relativa a ESTUDIO_DADOS
horarios: ["12:00", "19:00"]
# onde cada vídeo deste canal é publicado (ids de plataformas.yaml)
plataformas: [youtube, tiktok, facebook, instagram, kwai, snapchat]

formato:
  # 61–80 s: o TikTok só paga vídeos com 1 min ou mais; Reels via API vai até 90 s
  short_segundos: [61, 80]
  tiktok_segundos: [61, 80]
  palavras_min: 150
  palavras_max: 190
  cenas_min: 9
  cenas_max: 13
  janelas_min: 1
  janelas_max: 2

producao:
  quadros: manual               # gerados por você no Gemini (assinatura) a partir dos prompts
  gancho: manual                # clipe do Flow/Veo; pode seguir sem pelo painel
  voz: tts                      # "propria" = espera Audio/<id>.wav gravado por você

roteiro:
  instrucoes: >
    Narre com palavras próprias, fiel ao texto bíblico, sem inventar falas.
    O "Sistema" é um recurso do narrador e nunca fala por Deus.
    Toda janela de missão traz a referência (livro capítulo:versículo).
    Termine com um gancho para o próximo episódio.

estilo_visual:
  prompt_base: >
    vertical 9:16 webtoon panel, Korean manhwa art style, clean line art,
    cel shading, dramatic lighting, ancient Middle East setting (Iron Age Israel),
    historically plausible clothing, no text, no logos, no watermark
  evitar: ["texto na imagem", "rosto realista de figuras sagradas", "armaduras medievais europeias"]

personagens:
  - id: davi
    ficha: Personagens/davi_ficha.png
    descricao: "jovem pastor (1 Sm 17:42 o descreve como moço e ruivo), cabelo ruivo ondulado, túnica bege simples, funda de couro no cinto"
  - id: golias
    ficha: Personagens/golias_ficha.png
    descricao: "guerreiro filisteu de Gate, couraça de escamas e elmo de bronze, lança enorme (1 Sm 17:4-7)"
  - id: saul
    ficha: Personagens/saul_ficha.png
    descricao: "rei mais alto que todo o povo (1 Sm 9:2), barba escura, manto real escuro, coroa simples de bronze"

janela_de_missao:
  tema: pergaminho de luz
  cores: { fundo: "#1A1408", borda: "#E9C46A", titulo: "#FFE8A3", texto: "#F5ECD7", destaque: "#7FD1AE" }
  fonte_titulo: Cinzel.ttf
  fonte_texto: Nunito.ttf

# ---------------------------------------------------------------------------
# O "SISTEMA" — regras editoriais do canal (decisão sua).
# Enquanto este bloco não existir, o pipeline usa os tipos padrão
# (MISSAO, MISSAO_OCULTA, ITEM, STATUS) e exige referência em toda janela.
#
# sistema:
#   tipos: [MISSAO, MISSAO_OCULTA, STATUS, ITEM]
#   exige_referencia: true
#   proibido: ["voz de Deus", "inventar fala de personagem bíblico", "recompensa material"]
#   recompensas_permitidas: ["Fé", "Coragem", "Sabedoria", "Promessa desbloqueada"]
# ---------------------------------------------------------------------------
