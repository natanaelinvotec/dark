# Canal de curiosidades (ciência, espaço, história). Imagens vêm dos bancos com licença comercial.

slug: curiosidades
nome: Curiosidades
cor: "#0E9A82"
enabled: true
idioma: pt-BR
descricao: Ciência, espaço e história em pouco mais de 1 minuto
pasta: Canal-Curiosidades
horarios: ["12:00", "18:30"]
# onde cada vídeo deste canal é publicado (ids de plataformas.yaml)
plataformas: [youtube, tiktok, facebook, instagram, kwai, snapchat]

formato:
  # 61–80 s: o TikTok só paga vídeos com 1 min ou mais; Reels via API vai até 90 s
  short_segundos: [61, 80]
  tiktok_segundos: [61, 80]
  palavras_min: 150
  palavras_max: 195
  cenas_min: 10
  cenas_max: 16
  janelas_min: 0
  janelas_max: 0

producao:
  quadros: banco                # Pexels + Pixabay
  gancho: nenhum
  voz: tts

busca_visual_padrao: "night sky stars"

roteiro:
  instrucoes: >
    Fatos verificáveis, com pelo menos duas fontes confiáveis.
    Varie o formato (lista, mito ou verdade, pergunta e resposta, história).
    Cada cena traz um termo de busca visual em inglês, concreto e fotografável.

estilo_visual:
  prompt_base: ""
  evitar: ["pessoas reconhecíveis", "logotipos"]
