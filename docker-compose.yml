# Sobe o painel e o worker. A pasta do Drive sincronizado entra como volume.
# Ex. no Windows: ESTUDIO_DADOS_HOST="G:/Meu Drive/Estudio" docker compose up -d
# No Linux, a pasta ./dados precisa ser gravável pelo usuário do container (uid 10001):
#   mkdir -p dados && sudo chown 10001:10001 dados
# O hash da senha no .env vai entre aspas simples (tem '$').
services:
  painel:
    build: .
    env_file: .env
    environment:
      ESTUDIO_DADOS: /drive
      ESTUDIO_DB: /app/dados/estudio.db
    volumes:
      - ./dados:/app/dados
      - ${ESTUDIO_DADOS_HOST:?defina ESTUDIO_DADOS_HOST}:/drive
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  worker:
    build: .
    command: ["estudio", "worker"]
    env_file: .env
    environment:
      ESTUDIO_DADOS: /drive
      ESTUDIO_DB: /app/dados/estudio.db
      # o container é read_only: o modelo do faster-whisper precisa de um cache gravável
      HF_HOME: /app/dados/hf
    volumes:
      - ./dados:/app/dados
      - ${ESTUDIO_DADOS_HOST:?defina ESTUDIO_DADOS_HOST}:/drive
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 6g
    restart: unless-stopped
