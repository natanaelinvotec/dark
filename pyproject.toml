[project]
name = "estudio-canais"
version = "0.1.0"
description = "Pipeline de Shorts com IA e painel de aprovação (Estúdio de Canais)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "google-genai>=1.0",
    "pillow>=10.4",
    "itsdangerous>=2.2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
voz = ["faster-whisper>=1.0"]
# painel online: Firestore (telas e comandos) + Google Drive (prévias)
nuvem = [
    "google-cloud-firestore>=2.16",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
estudio = "estudio.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/estudio", "src/painel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["ffmpeg: precisa do binário ffmpeg instalado"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
